name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  check-version:
    name: Check version matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Compare --version with the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="${TAG#v}"
          actual="$(go run . --version)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Release tag is $TAG but the client reports version $actual. Update the version in client.go and re-create the release."
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: check-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            goos: darwin
            goarch: arm64
          - name: darwin-x86_64
            goos: darwin
            goarch: amd64
          - name: linux-x86_64
            goos: linux
            goarch: amd64
          - name: linux-armv5
            goos: linux
            goarch: arm
            goarm: "5"
          # Same build as linux-armv5, kept for the existing "linux-arm" name
          - name: linux-arm
            goos: linux
            goarch: arm
            goarm: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -trimpath -o "providore-client-${{ matrix.name }}" .
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "providore-client-${{ matrix.name }}" --clobber
